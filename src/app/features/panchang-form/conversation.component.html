<div class="screen">

  <!-- 🌌 Background Effects -->
  <div class="bg-overlay"></div>

  <!-- 🕉️ OM Floating -->
  <div class="om">ॐ</div>

  <!-- 🎤 LIVE CONVERSATION -->
  <div class="conversation-box" *ngIf="!responseText">

    <!-- Status / Prompt -->
    <div class="status">
      {{ statusMessage || '✨ Preparing...' }}
    </div>

    <!-- Listening Indicator -->
    <div class="voice-indicator" *ngIf="isListening">
      🎤 Listening...
      <div class="wave"></div>
    </div>

    <!-- Speaking Indicator -->
    <div class="voice-indicator speaking" *ngIf="isSpeaking">
      🔊 Speaking...
    </div>

  </div>

  <!-- 📜 RESULT -->
  <div class="result" *ngIf="responseText">

    <h3>📜 Sankalpam</h3>

    <p class="sankalpam-text">
      {{ responseText }}
    </p>

    <!-- 🎧 Audio Player -->
    <audio #audioPlayer
           *ngIf="audioSrc"
           [src]="audioSrc"
           (ended)="onAudioEnded()">
    </audio>

    <button 
      class="btn-primary audio-play"
      *ngIf="audioSrc || speechTextToPlay"
      [disabled]="isAudioPlaying"
      (click)="playAudio()">
      {{ isAudioPlaying ? '⏳ Playing Sankalpam...' : '▶️ Play Sankalpam Audio' }}
    </button>

    <button 
      class="btn-primary"
      (click)="restart()"
      [disabled]="isRestarting">

      {{ isRestarting ? '🔄 Restarting...' : '🔁 Start Again' }}

    </button>

  </div>

</div>
