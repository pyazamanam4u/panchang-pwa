<main class="app-container">

  <!-- 🌸 DEVOTIONAL BACKGROUND -->
  <div class="vedic-bg"></div>

  <!-- ✨ FLOATING PARTICLES -->
  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- 🔊 GLOBAL SPEECH OVERLAY -->
  <div class="speech-overlay" *ngIf="isSpeaking || isListening">

    <div class="speech-card">

      <div class="om-symbol">ॐ</div>

      <div class="speech-status">

        <div *ngIf="isSpeaking" class="status speaking">
          🔊 Speaking divine message...
        </div>

        <div *ngIf="isListening" class="status listening">
          🎤 Listening to your sankalpam...
        </div>

      </div>

      <div class="wave-loader">
        <span></span><span></span><span></span>
      </div>

    </div>
  </div>

  <!-- 🔥 GLOBAL LOADING -->
  <div class="loading-overlay" *ngIf="isGlobalLoading()">

    <div class="loading-spinner">

      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>

      <div class="loading-text">
        Preparing your Sankalpam experience...
      </div>

    </div>

  </div>

  <!-- 🪔 HEADER -->
  <header class="app-header" *ngIf="showHeader()">

    <div class="header-content">

      <div class="brand-section">

        <div class="brand-logo">
          <div class="logo-glow"></div>
          <span class="logo-symbol">ॐ</span>
        </div>

        <div class="brand-text">
          <h1 class="brand-title">Vedic Sankalpam AI</h1>
          <p class="brand-subtitle">Voice-powered devotional experience</p>
        </div>

      </div>

      <button class="logout-btn" (click)="logout()">
        ⏻
      </button>

    </div>

  </header>

  <!-- 📦 MAIN CONTENT -->
  <div class="main-content">

    <div class="content-wrapper">

      <router-outlet></router-outlet>

    </div>

  </div>

</main>
