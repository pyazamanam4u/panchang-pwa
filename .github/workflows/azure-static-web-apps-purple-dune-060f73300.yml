name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Dev

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build App
        run: |
          npm install
          npm run build -- --configuration production

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_DUNE_060F73300 }}
          action: "upload"
          app_location: "/"
          output_location: "dist/panchang-pwa"
