name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - Dev

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      # ✅ Checkout
      - uses: actions/checkout@v3

      # ✅ Use correct Node version (IMPORTANT for Angular)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ✅ Clean install (avoids dependency issues)
      - name: Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      # ✅ Build Angular app
      - name: Build Angular App
        run: npm run build -- --configuration production

      # 🔍 Debug (verify output)
      - name: Verify Build Output
        run: |
          echo "DIST"
          ls -la dist

          echo "APP"
          ls -la dist/panchang-pwa

          echo "BROWSER"
          ls -la dist/panchang-pwa/browser

      # 🚀 Deploy (NO Azure build)
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_DUNE_060F73300 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"

          # 🔥 CRITICAL FIXES
          skip_app_build: true
          app_location: "dist/panchang-pwa/browser"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_DUNE_060F73300 }}
          action: "close"
