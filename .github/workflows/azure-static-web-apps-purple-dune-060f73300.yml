name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - Dev

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      # ✅ Checkout code
      - name: Checkout
        uses: actions/checkout@v3

      # ✅ Install dependencies
      - name: Install Dependencies
        run: npm install

      # ✅ Build Angular app (Angular 17+ compatible)
      - name: Build Angular App
        run: npm run build -- --configuration production

      # 🔍 Debug (keep this for now, remove later)
      - name: Verify Build Output
        run: |
          echo "DIST ROOT"
          ls -la dist || echo "dist missing"

          echo "APP ROOT"
          ls -la dist/panchang-pwa || echo "panchang missing"

          echo "BROWSER ROOT"
          ls -la dist/panchang-pwa/browser || echo "browser missing"

      # 🚀 Deploy to Azure Static Web Apps
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_DUNE_060F73300 }}
          action: "upload"

          app_location: "/"
          api_location: ""

          # ✅ IMPORTANT: We already built the app manually
          skip_app_build: true

          # ✅ MUST point to folder containing index.html
          output_location: "dist/panchang-pwa/browser"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
